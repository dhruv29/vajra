# Starts the egress gate and the two networks.
#
#   tasks   internal: no route out. Task containers attach here and can reach
#           only the gate.
#   egress  ordinary network. Only the gate is attached, so it is the single
#           way out.
#
# The gate serves an HTTP proxy on 3128 and SOCKS5 on 1080. Neither port is
# published to the host; only containers on the task network can reach them.
#
# The gate runs as the user given by VAJRA_UID and VAJRA_GID, so the audit log
# it writes is owned by, and readable only by, the person who started it.
#
# Usage: VAJRA_UID=$(id -u) VAJRA_GID=$(id -g) VAJRA_CONFIG=/absolute/path/run.json VAJRA_AUDIT_DIR=/absolute/path/audit docker compose -f deploy/docker-compose.yml up -d --build
name: vajra

networks:
  tasks:
    name: vajra-task-net
    internal: true
  egress:
    name: vajra-egress

services:
  gate:
    build:
      context: ..
      dockerfile: Dockerfile
    image: vajra:local
    user: "${VAJRA_UID:?set VAJRA_UID to your user id: $(id -u)}:${VAJRA_GID:?set VAJRA_GID to your group id: $(id -g)}"
    command: ["gate", "-config", "/etc/vajra/run.json", "-listen", ":3128", "-socks", ":1080", "-audit", "/var/log/vajra/audit.jsonl"]
    volumes:
      - "${VAJRA_CONFIG:?set VAJRA_CONFIG to the absolute path of your run configuration}:/etc/vajra/run.json:ro"
      # The audit log, readable from the host: pass it to "vajra scan -gate-audit".
      # The directory must be writable by VAJRA_UID.
      - "${VAJRA_AUDIT_DIR:?set VAJRA_AUDIT_DIR to a directory for the gate audit log}:/var/log/vajra"
    networks:
      tasks:
        aliases: [gate]
      egress: {}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
