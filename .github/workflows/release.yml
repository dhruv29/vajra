name: release

# Runs when a version tag is pushed. It publishes binaries with checksums and
# a bill of materials, and a container image signed with the workflow's own
# identity, so a user can check that what they run was built here from this
# source. Every action is pinned to a commit: these jobs can publish and sign,
# and a tag that someone moved must not be able to do that in this project's
# name.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false # the tests must not be able to push
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false # there is no go.sum: the module has no dependencies
      - name: Test before publishing anything
        run: make check
      - name: Build for each platform
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            GOOS="$os" GOARCH="$arch" make build BINARY="dist/vajra-$os-$arch"
          done
      - name: Bill of materials and checksums
        run: |
          ./scripts/sbom.sh dist/vajra-linux-amd64 > dist/sbom.json
          cd dist && sha256sum vajra-* sbom.json > SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --title "$TAG" --generate-notes --verify-tag

  image:
    runs-on: ubuntu-latest
    needs: binaries
    permissions:
      contents: read
      packages: write # push the image
      id-token: write # sign it with the workflow's identity, no stored key
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign the image by digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
